<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128"><defs><linearGradient id="grad"><stop stop-color="#c06020"/><stop offset="1" stop-color="#2080c0"/></linearGradient>
<linearGradient id="alpha"><stop stop-color="white" stop-opacity="0"/><stop offset="1" stop-color="white"/></linearGradient>
<clipPath id="clip"><rect x="40" y="24" width="48" height="72"/></clipPath>
<mask id="mask" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128"><rect width="128" height="128" fill="url(#alpha)"/></mask>
<pattern id="pattern" patternUnits="userSpaceOnUse" x="0" y="0" width="16" height="16"><rect width="8" height="16" fill="#c06020"/><rect x="8" width="8" height="16" fill="#2080c0"/></pattern>
<filter id="inner" filterUnits="userSpaceOnUse" x="0" y="0" width="128" height="128"><feOffset dx="8" dy="4"/></filter><filter id="f" filterUnits="userSpaceOnUse" x="0" y="0" width="128" height="128"  color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="3" seed="42" result="noise"/>
<feComponentTransfer in="noise" result="noise"><feFuncR type="discrete" tableValues="0 1"/><feFuncG type="discrete" tableValues="0 1"/></feComponentTransfer>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" result="warped"/>
<feGaussianBlur in="warped" stdDeviation="2" result="height"/>
<feDiffuseLighting in="height" surfaceScale="8" diffuseConstant=".7" result="diffuse"><feDistantLight azimuth="225" elevation="45"/></feDiffuseLighting>
<feSpecularLighting in="height" surfaceScale="8" specularExponent="16" specularConstant=".5" result="specular"><fePointLight x="32" y="32" z="96"/></feSpecularLighting>
<feComposite in="warped" in2="diffuse" operator="arithmetic" k1="1" result="lit"/>
<feComposite in="specular" in2="lit" operator="arithmetic" k2="1" k3="1"/>
<feComposite in2="warped" operator="in" result="material"/>
<feDropShadow in="warped" stdDeviation="3" dx="6" dy="4" flood-opacity=".6" result="shadow"/>
<feMerge><feMergeNode in="shadow"/><feMergeNode in="material"/></feMerge></filter></defs><g filter="url(#f)" ><rect x="24" y="24" width="80" height="80" fill="url(#grad)"/></g></svg>